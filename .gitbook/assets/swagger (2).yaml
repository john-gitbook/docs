          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ApiError'
  /account/profile/referral_code:
    post:
      security:
        - BearerToken: []
