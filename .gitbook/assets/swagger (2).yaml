      tags:
        - Account
      summary: Updates account profile fields
      operationId: update-account-profile-referral-code
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.AccountProfileResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ApiError'
  /account/profile/username:
    post:
      security:
        - BearerToken: []
      description: |
        Respond with requester's account information
      produces:
        - application/json
      tags:
        - Account
      summary: Updates account profile username fields
      operationId: update-account-profile-username
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.AccountProfileResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ApiError'
  /auth:
    post:
      description: |
        Authenticate using signed payload to get a JWT for usage in other endpoints

        There are multiple valid headers required to be sent as part of this request.

        For onboarding examples, refer to `go`, `java` and `python` code in [code-samples](https://github.com/tradeparadex/code-samples).

        #### StarkNet Message Hash and Signature

        Inspired by [EIP-712](https://eips.ethereum.org/EIPS/eip-712),
        (a standard for hashing and signing typed structured data)
        the encoding of an off-chain message is defined as:

        `signed_data = Enc[PREFIX_MESSAGE, domain_separator, account, hash_struct(message)]`

        where:

        - `PREFIX_MESSAGE = "StarkNet Message"`
        - `domain_separator` is defined as the `hash_struct` of the StarkNetDomain struct:
          * Struct contains: `name`, `chainId` and `version`
          * `chainId` is can be obtained calling `GET /system/config`
        - `account` is the StarkNet account address
        - The message to be hashed is represented as a struct
          * `hash_struct(message) = Enc[type_hash(MyStruct), Enc[param1], ..., Enc[paramN]]`
          * where `type_hash` is defined as in EIP-712 (but using `selector` instead of `keccak`)
          * More details on StarkNet - [Hash Functions](https://docs.starknet.io/documentation/architecture_and_concepts/Hashing/hash-functions/)

        In case of more complex structure of object, you have to work in the spirit of EIP-712.
        This json structure has 4 mandatory items: `types`, `primaryType`, `domain` and `message`.
        These items are designed to be able to be an interface with a wallet.
        At sign request, the wallet will display:

        - `message` will be displayed at the bottom of the wallet display,
        showing clearly (not in hex) the message to sign.
        Its structure has to be in accordance with the type listed in primaryType,
        defined in types.
        - `domain` will be shown above the message.
        Its structure has to be in accordance with `StarkNetDomain`.

        The predefined types that you can use :

        - `felt` : for an integer on 251 bits.
        - `felt*` : for an array of felt.
        - `string` : for a shortString of 31 ASCII characters max.
        - `selector` : for a name of a smart contract function.
        - `merkletree` : for a Root of a Merkle tree, calculated with the provided data.

        Specification details: [Signing transactions and off-chain messages](https://github.com/argentlabs/argent-x/discussions/14)

        #### Message Hash Sample Code

        For a complete `message_hash` example, refer to `python` code in [code-samples](https://github.com/tradeparadex/code-samples).

        > Examples:

        ```json
        {
          "paradex-signature-expiration": 1682364556,
          "paradex-starknet-account": "0x129f3dc1b8962d8a87abc692424c78fda963ade0e1cd17bf3d1c26f8d41ee7a",
          "paradex-starknet-signature": [
            "1381323390094460587764867648394252677239485992175346764030313478865763678671",
            "396490140510115262427678549757564216013606350105112805717359873954984880589"
          ],
          "paradex-timestamp": 1681759756
        }
        ```
      produces:
        - application/json
      tags:
        - Authentication
      summary: Get JWT
      operationId: auth
      parameters:
        - type: string
          description: Starknet account
          name: PARADEX-STARKNET-ACCOUNT
          in: header
          required: true
        - type: string
          description: Starknet signature
          name: PARADEX-STARKNET-SIGNATURE
          in: header
          required: true
        - type: string
          description: Timestamp when the signature was created
          name: PARADEX-TIMESTAMP
          in: header
          required: true
        - type: string
          description: Timestamp when signature expires (default 30 min | Max 1 week)
          name: PARADEX-SIGNATURE-EXPIRATION
          in: header
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.AuthResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ApiError'
  /balance:
    get:
      security:
        - BearerToken: []
      description: |
        Respond with requester's own balances
      produces:
        - application/json
      tags:
        - Account
      summary: List balances
      operationId: get-balance
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetBalancesResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ApiError'
  /bbo/{market}:
    get:
      description: |
        Get the best bid/ask for the given market
      produces:
        - application/json
      tags:
        - Markets
      summary: Get market bbo
      operationId: get-bbo
      parameters:
        - type: string
          description: 'Market symbol - ex: BTC-USD-PERP'
          name: market
          in: path
          required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.BBOResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /fills:
    get:
      security:
        - BearerToken: []
      description: "This API returns a list of matched orders (i.e. fills) that have been sent to\r\nchain for settlement.\r\n"
      produces:
        - application/json
      tags:
        - Account
      summary: List fills
      parameters:
        - type: string
          description: Returns the ‘next’ paginated page.
          name: cursor
          in: query
        - type: integer
          description: End Time (unix time millisecond)
          name: end_at
          in: query
        - type: string
          name: market
          in: query
        - maximum: 5000
          minimum: 1
          type: integer
          default: 100
          description: Limit the number of responses in the page
          name: page_size
          in: query
        - type: integer
          description: Start Time (unix time millisecond)
          name: start_at
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetFillsResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ApiError'
  /funding/data:
    get:
      description: |
        List historical funding data by market
      produces:
        - application/json
      tags:
        - Markets
      summary: Funding data history
      operationId: get-funding-data
      parameters:
        - type: string
          description: Returns the ‘next’ paginated page.
          name: cursor
          in: query
        - type: integer
          description: End Time (unix time millisecond)
          name: end_at
          in: query
        - type: string
          example: BTC-USD-PERP
          description: Market for which funding payments are queried
          name: market
          in: query
          required: true
        - maximum: 5000
          minimum: 1
          type: integer
          default: 100
          description: Limit the number of responses in the page
          name: page_size
          in: query
        - type: integer
          description: Start Time (unix time millisecond)
          name: start_at
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.FundingDataResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /funding/payments:
    get:
      security:
        - BearerToken: []
      description: |
        List funding payments made by/to the requester's account

        *Funding payments are periodic payments between traders to make the perpetual
        futures contract price is close to the index price.*
      produces:
        - application/json
      tags:
        - Account
      summary: Funding payments history
      operationId: get-funding
      parameters:
        - type: string
          description: Returns the ‘next’ paginated page.
          name: cursor
          in: query
        - type: integer
          description: End Time (unix time millisecond)
          name: end_at
          in: query
        - type: string
          example: BTC-USD-PERP
          description: Market for which funding payments are queried
          name: market
          in: query
          required: true
        - maximum: 5000
          minimum: 1
          type: integer
          default: 100
          description: Limit the number of responses in the page
          name: page_size
          in: query
        - type: integer
          description: Start Time (unix time millisecond)
          name: start_at
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.FundingHistoryResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ApiError'
  /insurance:
    get:
      description: |
        Get insurance fund account's information
      produces:
        - application/json
      tags:
        - Insurance
      summary: Get insurance fund account information
      operationId: get-insurance-fund
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.InsuranceAccountResp'
  /liquidations:
    get:
      security:
        - BearerToken: []
      description: |
        Retrieves a list of liquidations associated to the requester's account
      produces:
        - application/json
      tags:
        - Liquidations
      summary: List liquidations
      operationId: get-liquidations
      parameters:
        - type: integer
          description: Start Time (unix time millisecond)
          name: from
          in: query
        - type: integer
          description: End Time (unix time millisecond)
          name: to
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetLiquidations'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /markets:
    get:
      description: |
        Get markets static data component
      produces:
        - application/json
      tags:
        - Markets
      summary: List available markets
      operationId: get-markets
      parameters:
        - type: string
          description: 'Market Name - example: BTC-USD-PERP'
          name: market
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetMarkets'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ApiError'
  /markets/klines:
    get:
      description: Klines for a symbol
      produces:
        - application/json
      tags:
        - Markets
      summary: OHLCV for a symbol
      operationId: markets-klines
      parameters:
        - type: integer
          description: end time for klines in milliseconds
          name: end_at
          in: query
          required: true
        - type: string
          description: 'resolution in minutes: 1, 3, 5, 15, 30, 60'
          name: resolution
          in: query
          required: true
        - type: integer
          description: start time for klines in milliseconds
          name: start_at
          in: query
          required: true
        - type: string
          description: Symbol of the market pair
          name: symbol
          in: query
          required: true
      responses:
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /markets/summary:
    get:
      description: |
        Get markets dynamic data component
      produces:
        - application/json
      tags:
        - Markets
      summary: List available markets summary
      operationId: get-markets-summary
      parameters:
        - type: integer
          description: End Time (unix time millisecond)
          name: end
          in: query
        - type: string
          example: BTC-USD-PERP
          description: Name of the market for which summary is requested (for all available markets use ALL)
          name: market
          in: query
          required: true
        - type: integer
          description: Start Time (unix time millisecond)
          name: start
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetMarketSummary'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /onboarding:
    post:
      description: |
        Onboarding verifies that the caller owns the StarkNet address and enters them
        into the database. This call is idempotent.
      produces:
        - application/json
      tags:
        - Authentication
      summary: Onboarding
      operationId: onboarding
      parameters:
        - type: string
          description: Ethereum account used to onboard
          name: PARADEX-ETHEREUM-ACCOUNT
          in: header
          required: true
        - type: string
          description: Starknet address
          name: PARADEX-STARKNET-ACCOUNT
          in: header
          required: true
        - type: string
          description: Starknet signature
          name: PARADEX-STARKNET-SIGNATURE
          in: header
          required: true
        - description: Onboarding user public_key
          name: request
          in: body
          required: true
          schema:
            $ref: '#/definitions/requests.Onboarding'
      responses:
        '200':
          description: An empty response
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ApiError'
  /orderbook/{market}:
    get:
      description: |
        Get snapshot of the orderbook for the given market
      produces:
        - application/json
      tags:
        - Markets
      summary: Get market orderbook
      operationId: get-orderbook
      parameters:
        - type: string
          description: 'Market symbol - ex: BTC-USD-PERP'
          name: market
          in: path
          required: true
        - type: integer
          default: 20
          description: Depth
          name: depth
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.AskBidArray'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /orders:
    get:
      security:
        - BearerToken: []
      description: |
        Get current user all open orders
      tags:
        - Orders
      summary: Get open orders
      operationId: get-open-orders
      parameters:
        - type: string
          description: 'Market symbol, ex: BTC-USD-PERP'
          name: market
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetOpenOrders'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
    post:
      security:
        - BearerToken: []
      description: |
        Open a new order
      produces:
        - application/json
      tags:
        - Orders
      summary: Create order
      operationId: orders-new
      parameters:
        - description: Order content
          name: params
          in: body
          required: true
          schema:
            $ref: '#/definitions/requests.OrderRequest'
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/responses.OrderResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
    delete:
      security:
        - BearerToken: []
      produces:
        - application/json
      tags:
        - Orders
      summary: Cancel all open orders
      operationId: orders-cancel-all
      parameters:
        - type: string
          description: Market to cancel orders for
          name: market
          in: query
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /orders-history:
    get:
      security:
        - BearerToken: []
      description: |
        Get current user orders filtered on attributes
      produces:
        - application/json
      tags:
        - Orders
      summary: Get orders
      operationId: get-orders
      parameters:
        - type: string
          example: client-id
          description: Unique ID of client generating the order
          name: client_id
          in: query
        - type: string
          description: Returns the ‘next’ paginated page.
          name: cursor
          in: query
        - type: integer
          description: End Time (unix time millisecond)
          name: end_at
          in: query
        - type: string
          example: BTC-USD-PERP
          description: Market for the order
          name: market
          in: query
        - maximum: 5000
          minimum: 1
          type: integer
          default: 100
          description: Limit the number of responses in the page
          name: page_size
          in: query
        - enum:
            - BUY
            - SELL
          type: string
          description: Order side
          name: side
          in: query
        - type: integer
          description: Start Time (unix time millisecond)
          name: start_at
          in: query
        - enum:
            - OPEN
            - CLOSED
            - NEW
          type: string
          description: Order status
          name: status
          in: query
        - enum:
            - LIMIT
            - MARKET
          type: string
          description: Order type
          name: type
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetOrders'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /orders/by_client_id/{client_id}:
    get:
      security:
        - BearerToken: []
      description: |
        Get an order by client id. Only returns orders in `OPEN` status.
      produces:
        - application/json
      tags:
        - Orders
      summary: Get order by client id
      operationId: orders-get-by-client-id
      parameters:
        - type: string
          description: Client Order Id
          name: client_id
          in: path
          required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.OrderResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
    delete:
      security:
        - BearerToken: []
      produces:
        - application/json
      tags:
        - Orders
      summary: Cancel open order by client order id
      operationId: orders-cancel-by-client-id
      parameters:
        - type: string
          description: Client Order Id
          name: client_id
          in: path
          required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /orders/{order_id}:
    get:
      security:
        - BearerToken: []
      description: |
        Get an order by id. Only return orders in `OPEN` or `NEW` status.
      produces:
        - application/json
      tags:
        - Orders
      summary: Get order
      operationId: orders-get
      parameters:
        - type: string
          description: Order Id
          name: order_id
          in: path
          required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.OrderResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
    delete:
      security:
        - BearerToken: []
      produces:
        - application/json
      tags:
        - Orders
      summary: Cancel order
      operationId: orders-cancel
      parameters:
        - type: string
          description: Order Id
          name: order_id
          in: path
          required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /points_data/{market}/{program}:
    get:
      security:
        - BearerToken: []
      description: |
        Get latest points data for requester's account
      produces:
        - application/json
      tags:
        - Points
      summary: List latest points data
      operationId: get-points-data
      parameters:
        - type: string
          description: 'Market Name - example: BTC-USD-PERP, ALL'
          name: market
          in: path
          required: true
        - type: string
          description: 'Program Name - example: Maker, Fee'
          name: program
          in: path
          required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetPoints'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ApiError'
  /positions:
    get:
      security:
        - BearerToken: []
      description: |
        Get all positions owned by current user
      produces:
        - application/json
      tags:
        - Account
      summary: List open positions
      operationId: get-positions
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetPositionsResp'
  /referrals/config:
    get:
      description: |
        Get referral program config data
      produces:
        - application/json
      tags:
        - Referrals
      summary: Get referral config
      operationId: get-referral-config
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetReferralConfig'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /referrals/summary:
    get:
      security:
        - BearerToken: []
      description: |
        Get latest referree data for requester's account
      produces:
        - application/json
      tags:
        - Referrals
      summary: Get account referral details
      operationId: get-referrals-summary
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetReferrals'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ApiError'
  /system/config:
    get:
      description: |
        Get clearing and settlement layer config for Paradex
      produces:
        - application/json
      tags:
        - System
      summary: Get system config
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.SystemConfigResponse'
  /system/state:
    get:
      description: |
        Get the current state of the Paradex system
      produces:
        - application/json
      tags:
        - System
      summary: Get system state
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.SystemStateResponse'
  /system/time:
    get:
      description: |
        Get the current time in the Paradex
      produces:
        - application/json
      tags:
        - System
      summary: Get system time (unix milliseconds)
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.SystemTimeResponse'
  /tradebusts:
    get:
      security:
        - BearerToken: []
      description: |
        Retrieves a list of tradebusts associated to the requester's account
      produces:
        - application/json
      tags:
        - Account
      summary: List tradebusts
      operationId: tradebusts
      parameters:
        - type: string
          description: Returns the ‘next’ paginated page.
          name: cursor
          in: query
        - type: integer
          description: End Time (unix time millisecond)
          name: end_at
          in: query
        - maximum: 5000
          minimum: 1
          type: integer
          default: 100
          description: Limit the number of responses in the page
          name: page_size
          in: query
        - type: integer
          description: Start Time (unix time millisecond)
          name: start_at
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetTradebustsResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /trades:
    get:
      description: |
        List trades that happened on a given market (trade tape).
      produces:
        - application/json
      tags:
        - Trades
      summary: Trade tape
      operationId: trades
      parameters:
        - type: string
          description: Returns the ‘next’ paginated page.
          name: cursor
          in: query
        - type: integer
          description: End Time (unix time millisecond)
          name: end_at
          in: query
        - type: string
          example: BTC-USD-PERP
          description: Market name
          name: market
          in: query
          required: true
        - maximum: 5000
          minimum: 1
          type: integer
          default: 100
          description: Limit the number of responses in the page
          name: page_size
          in: query
        - type: integer
          description: Start Time (unix time millisecond)
          name: start_at
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetTradesResp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /transactions:
    get:
      security:
        - BearerToken: []
      description: |
        Retrieves a list of transactions initiated by the user
      produces:
        - application/json
      tags:
        - Account
      summary: List transactions
      operationId: transactions
      parameters:
        - type: string
          description: Returns the ‘next’ paginated page.
          name: cursor
          in: query
        - type: integer
          description: End Time (unix time millisecond)
          name: end_at
          in: query
        - maximum: 5000
          minimum: 1
          type: integer
          default: 100
          description: Limit the number of responses in the page
          name: page_size
          in: query
        - type: integer
          description: Start Time (unix time millisecond)
          name: start_at
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetTransactionResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
  /transfers:
    get:
      security:
        - BearerToken: []
      produces:
        - application/json
      tags:
        - Transfers
      summary: List account's transfers, i.e. deposits and withdrawals
      operationId: get-transfers
      parameters:
        - type: string
          description: Returns the ‘next’ paginated page.
          name: cursor
          in: query
        - type: integer
          description: End Time (unix time millisecond)
          name: end_at
          in: query
        - maximum: 5000
          minimum: 1
          type: integer
          default: 100
          description: Limit the number of responses in the page
          name: page_size
          in: query
        - type: integer
          description: Start Time (unix time millisecond)
          name: start_at
          in: query
        - enum:
            - PENDING
            - AVAILABLE
            - COMPLETED
            - FAILED
          type: string
          name: status
          in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.GetTransfersResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiError'
definitions:
  requests.Onboarding:
    type: object
    properties:
      public_key:
        description: Public key of the user being onboarded.
        type: string
        example: '0x3d9f2b2e5f50c1aade60ca540368cd7490160f41270c192c05729fe35b656a9'
      referral_code:
        description: Referral code of the user who referred the user being onboarded.
        type: string
        example: cryptofox8
  requests.OrderRequest:
    type: object
    required:
      - instruction
      - market
      - price
      - side
      - signature
      - signature_timestamp
      - size
      - type
    properties:
      client_id:
        description: Unique client assigned ID for the order
        type: string
        maxLength: 64
        example: '123454321'
      flags:
        description: 'Order flags, allow flag: REDUCE_ONLY'
        type: array
        items:
          $ref: '#/definitions/responses.OrderFlag'
      instruction:
        description: Order Instruction, GTC, IOC or POST_ONLY if empty GTC
        type: string
      market:
        description: Market for which order is created
        type: string
        example: BTC-USD-PERP
      price:
        description: Order price
        type: string
        example: '29500.12'
      recv_window:
        description: Order will be created if it is received by API within RecvWindow milliseconds from signature timestamp, minimum is 10 milliseconds
        type: integer
      side:
        description: Order side
        allOf:
          - $ref: '#/definitions/responses.OrderSide'
      signature:
        description: Order Payload signed with STARK Private Key
        type: string
      signature_timestamp:
        description: Timestamp of order creation, used for signature verification
        type: integer
      size:
        description: Size of the order
        type: string
        example: '1.213'
      stp:
        description: Self Trade Prevention, EXPIRE_MAKER, EXPIRE_TAKER or EXPIRE_BOTH, if empty EXPIRE_TAKER
        type: string
      trigger_price:
        description: Trigger price for stop order
        type: string
      type:
        description: Order type
        allOf:
          - $ref: '#/definitions/responses.OrderType'
  responses.AccountProfileResp:
    type: object
    properties:
      is_username_private:
        type: boolean
        example: true
      programs_eligibility:
        $ref: '#/definitions/responses.ProgramsEligibility'
      referral_code:
        type: string
        example: cryptofox8
      referred_by:
        type: string
        example: maxDegen
      username:
        type: string
        example: username
  responses.AccountSummaryResponse:
    type: object
    properties:
      account:
        description: User's starknet account
        type: string
        example: '0x495d2eb5236a12b8b4ad7d3849ce6a203ce21c43f473c248dfd5ce70d9454fa'
      account_value:
        description: Current account value [with unrealized P&Ls]
        type: string
        example: '136285.06918911'
      free_collateral:
        description: Free collateral available (Account value in excess of Initial Margin required)
        type: string
        example: '73276.47229774'
      initial_margin_requirement:
        description: Amount required to open trade for the existing positions
        type: string
        example: '63008.59689218'
      maintenance_margin_requirement:
        description: Amount required to maintain exisiting positions
        type: string
        example: '31597.25239676'
      margin_cushion:
        description: Acc value in excess of maintenance margin required
        type: string
        example: '104687.8167956'
      seq_no:
        description: Unique increasing number (non-sequential) that is assigned to this account update. Can be used to deduplicate multiple feeds
        type: integer
        example: 1681471234972000000
      settlement_asset:
        description: Settlement asset for the account
        type: string
        example: USDC
      status:
        description: Status of the acc - like ACTIVE, LIQUIDATION
        type: string
        example: ACTIVE
      total_collateral:
        description: User's total collateral
        type: string
        example: '123003.62047353'
      updated_at:
        description: Account last updated time
        type: integer
        example: 1681471234972
  responses.ApiError:
    type: object
    properties:
      data:
        description: any additional data related to the error
      error:
        description: unique immutable string identifier for specific error
        allOf:
          - $ref: '#/definitions/responses.ErrorCode'
        example: NOT_ONBOARDED
      message:
        description: detailed description of error and how to address it
        type: string
        example: User has never called /onboarding endpoint
  responses.AskBidArray:
    type: object
    properties:
      asks:
        description: List of Ask sizes and prices
        type: array
        items:
          type: array
          items:
            type: string
      bids:
        description: List of Bid sizes and prices
        type: array
        items:
          type: array
          items:
            type: string
      last_updated_at:
        description: Last update to the orderbook in milliseconds
        type: integer
        example: 1681462770114
      market:
        description: Market name
        type: string
        example: ETH-USD-PERP
      seq_no:
        description: Sequence number of the orderbook
        type: integer
        example: 20784
  responses.AuthResp:
    type: object
    properties:
      jwt_token:
        description: Authentication token
        type: string
        example: eyJhbGciOiJFUzM4NCIsInR5cCI6IkpXVCJ9.eyJ0eXAiOiJhdCtKV1QiLCJleHAiOjE2ODE0NTI5MDcsImlhdCI6MTY4MTQ1MjYwNywiaXNzIjoiUGFyYWRleCBzdGFnaW5nIiwic3ViIjoiMHg0OTVkMmViNTIzNmExMmI4YjRhZDdkMzg0OWNlNmEyMDNjZTIxYzQzZjQ3M2MyNDhkZmQ1Y2U3MGQ5NDU0ZmEifQ.BPihIbGhnnsuPlReqC9x12JFXldpswg5EdA6tTiDQm-_UHaRz_8RfVBqWc2fPN6CzFsXTq7GowZu-2qMxPvZK_fGcxEhTp2k1r8MUxowlUIT4vPu2scCwrsyIujlCAwS
  responses.BBOResp:
    type: object
    properties:
      ask:
        description: Best ask price
        type: string
        example: '30130.15'
      ask_size:
        description: Best ask size
        type: string
        example: '0.05'
      bid:
        description: Best bid price
        type: string
